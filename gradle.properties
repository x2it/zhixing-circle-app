# Gradle
# 沙箱资源受限：控制内存与并发，避免构建进程占满导致环境过载
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
# Kotlin 编译在 Gradle 进程内执行，避免独立 Kotlin daemon 常驻占资源
kotlin.compiler.execution.strategy=in-process

# Compose
androidx.compose.compiler.plugins.kotlin.includeSourceInformation=false
org.gradle.java.home=/home/user/.local/toolchain/jdk-17.0.12+7
